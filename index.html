<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacela ApesUI 1.1</title>
  <style>
    :root {
      --bg-color: #080c14;
      --card-bg: rgba(18, 25, 43, 0.75);
      --card-border: rgba(0, 229, 255, 0.2);
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.4);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --focus-ring: #00e5ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-size: cover;
      background-position: center;
      transition: background 0.4s ease;
    }

    /* Status Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      z-index: 10;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-version {
      font-size: 0.85rem;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-left: 0.8rem;
    }

    .clock-display {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* Main Grid */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 3rem;
    }

    .section-label {
      font-size: 1.1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1.5rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
      max-width: 1400px;
    }

    .tv-tile {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 2.2rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      outline: none;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .tv-tile:focus,
    .tv-tile.selected {
      transform: scale(1.06);
      border-color: var(--focus-ring);
      box-shadow: 0 0 25px var(--accent-glow), 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .tile-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .tile-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .tile-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Bottom Info & Navigation Helper */
    .footer-bar {
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0,0,0,0.4);
    }

    .remote-hints span {
      background: rgba(255, 255, 255, 0.12);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      color: var(--text-main);
      margin: 0 0.2rem;
    }

    /* Modal / Window Shell */
    .app-window {
      position: fixed;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 90%;
      background: rgba(10, 14, 23, 0.96);
      border: 2px solid var(--accent);
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
      border-radius: 20px;
      z-index: 100;
      display: none;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .window-header {
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(0,0,0,0.5);
    }
